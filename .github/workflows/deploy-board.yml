name: Deploy board function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run backend tests
        working-directory: supabase/functions/board
        run: deno test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy board --project-ref $SUPABASE_PROJECT_ID
